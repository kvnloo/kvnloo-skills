[tools.qmd]
version = "2.8.3"
check = "qmd --version"
install = "npm install -g --prefix ~/.local @tobilu/qmd@2.8.3; then qmd skill show"

[tools.fff]
version = "0.11.0"
check = "python3 -m pip show fff-search"
install = "No standalone CLI or skill. fff-search==0.11.0 arrives when z0intelligence is installed."

[tools.ctx]
version = "2.2.7-reviewed"
check = "ctx --version"
install = "Install the ctxrs/ctx 2.2.7 release for the target OS; checksum verification remains required."

[tools.agent-reach]
version = "commit:e87bcdb17713c24513f6151d508f701b87dfd797"
check = "agent-reach --version"
install = "uv tool install git+https://github.com/kvnloo/Agent-Reach.git@e87bcdb17713c24513f6151d508f701b87dfd797"

[tools.agentsview]
version = "commit:430b853c64ab5d5e4fdddf963883ebc4231bcb77"
check = "agentsview --version"
install = "Use the agentsview repository installer at the recorded commit; then agentsview skills install."

[tools.jev]
version = "commit:412c35261986c5b70668fb9c59e0d1a761d63972"
check = "jev --help"
install = "Run python3 install.py in the pinned hermes-jev-skills checkout; no key is read by this collection."

[tools.no-mistakes]
version = "unresolved"
check = "Skill only; no standalone binary established"
install = "Keep the local skill reference until upstream commit provenance is confirmed."

[tools.yt-dlp]
version = "os-package"
check = "yt-dlp --version"
install = "apt install yt-dlp OR pacman -S yt-dlp; installed version must be recorded on the target machine."

[tools.mcporter]
version = "0.12.3"
check = "mcporter --version"
install = "npm install -g --prefix ~/.local mcporter@0.12.3"

[tools.gh]
version = "os-package"
check = "gh --version"
install = "apt install gh OR pacman -S github-cli"

[tools.jq]
version = "os-package"
check = "jq --version"
install = "apt install jq OR pacman -S jq"

[tools.rg]
version = "os-package"
check = "rg --version"
install = "apt install ripgrep OR pacman -S ripgrep"

[tools.ffmpeg]
version = "os-package"
check = "ffmpeg -version"
install = "apt install ffmpeg OR pacman -S ffmpeg"
