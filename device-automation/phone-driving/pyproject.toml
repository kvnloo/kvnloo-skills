[project]
name = "phone-driving"
version = "0.1.0"
description = "Safe, locked, owner-aware phone driving over uiautomator2, with an install/IME/settings guard."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["uiautomator2>=3.7,<3.8"]

[project.scripts]
phone = "phone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phone"]
